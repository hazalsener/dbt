# *************************** SqlDBM: Databricks ***************************
# * Generated by SqlDBM: Sample - Databricks Data Vault by hazal.sener+yew *


version: 2

sources:
  - name: RAW
    version: 2

    sources:
      - name: rv_1
        description: Raw Vault schema (Release 1). Contains Hub, Satellite, and Link tables for Data Vault model.
        database: RAW_DB
        schema: rv_1
        loader: databricks
        loaded_at_field: load_date
        meta:
          owner: data-engineering
          dv_layer: hub
          dv_release: 1.0
          source_system: POS + ECOM
        tags:
          - raw_vault
          - hub
          - customer
        config:
          enabled: true
          schema: rv_1
          database: RAW_DB
        overrides: 
        freshness:
          warn_after:
            count: 24
            period: hour
          error_after:
            count: 48
            period: hour
          filter: delete_flag = 'N'
        quoting:
          database: false
          schema: false
          identifier: true
    
    tables:
          - name: hub_customer
            description: Hub table designed to store unique business keys of customers.
            columns:
              - name: customer_hkey
                description: Surrogate hash key representing unique customer business key.
                tests:
                  - not_null
                  - unique
              - name: load_date
                description: Date/time the record was committed into the table.
              - name: load_cycle_id
                description: ETL batch cycle identifier.
              - name: record_source
                description: Source system of record.
              - name: c_name_bk
                description: Business key name for the customer.
              - name: new_column
                description: Custom numeric attribute added in RV1 release.

    tables:
      - name: bridge_customer_supplier
        description: Bridge table establishing many-to-many relationships between customers, suppliers, and nations, facilitating complex interconnected data representations.
        meta:
          data_product_owner: Hazal
        columns:
          - name: bridge_customer_supplier_hkey
            description: Unique surrogate key for identifying each bridge table record
            tests:
              - unique
              - not null
          - name: load_date
            description: Date Time the record was commited into the table
            tests:
              - unique
              - not null
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
            tests:
              - unique
              - not null
          - name: c_name_bk
            description: Business key representing the customer name
            tests:
              - unique
              - not null
          - name: n_name_bk
            description: Business key representing the nation name
            tests:
              - unique
              - not null
          - name: s_name_bk
            description: Business key representing the supplier name
            tests:
              - unique
              - not null
          - name: lnk_supplier_nation_hkey
            description: Foreign key linking to the supplier-nation link
            tests:
              - unique
              - not null
          - name: nation_hkey
            description: Foreign key referencing the nation hash key
            tests:
              - unique
              - not null
          - name: customer_hkey
            description: Foreign key referencing the customer hash key
            tests:
              - unique
              - not null
          - name: lnk_customer_nation_hkey
            description: Foreign key linking to the customer-nation link
            tests:
              - unique
              - not null
          - name: supplier_hkey
            description: Foreign key referencing the supplier hash key
            tests:
              - unique
              - not null

      - name: DIM_CAMPAIGN
        description: Dimension table for marketing campaign details
        meta:
          data_product_owner: Hazal
        columns:
          - name: CAMPAIGN_HKEY
            description: Unique surrogate key for the marketing campaign
          - name: CAMPAIGN_ID
            description: Unique identifier for the campaign
          - name: CAMPAIGN_NAME
            description: Official name of the marketing campaign
          - name: CAMPAIGN_START_DATE
            description: First day of the marketing campaign
          - name: CAMPAIGN_END_DATE
            description: Last day of the marketing campaign
          - name: CAMPAIGN_STATUS_VALUE
            description: Current status of the marketing campaign

      - name: DIM_CHANNEL
        description: Dimension table for sales and distribution channels
        meta:
          data_product_owner: Hazal
        columns:
          - name: CHANNEL_HKEY
            description: Unique surrogate key for sales channel
          - name: CHANNEL_NAME
            description: Descriptive name of the sales channel
          - name: CHANNEL_TYPE
            description: Broad classification of the channel type

      - name: DIM_CUSTOMER
        description: Dimension table storing customer master data
        meta:
          data_product_owner: Hazal
        columns:
          - name: CUSTOMER_HKEY
            description: Unique surrogate key for the customer
          - name: CUSTOMER_NBR
            description: Customer's unique identification number
          - name: CUSTOMER_FIRST_NAME
            description: Foreign key referencing the customer hash key for linking to the customer hub
            tests:
              - unique
              - not null
          - name: CUSTOMER_EMAIL_ADDRESS
            description: Primary contact email address
          - name: CUSTOMER_SEGMENT_CD
            description: Code representing customer's market segment
          - name: CUSTOMER_SHOW_SIZE
            description: Number of purchases made by the customer

      - name: DIM_DATE
        description: Comprehensive date dimension table with multiple calendar and fiscal attributes
        meta:
          data_product_owner: Hazal
        columns:
          - name: DATE
            description: The actual calendar date, serving as the primary reference for all date-related analysis.
          - name: YEAR
            description: Numeric representation of the calendar year
          - name: QUARTER
            description: Numeric representation of the calendar quarter
          - name: MONTH
            description: Numeric representation of the calendar month
          - name: DAY_OF_MONTH
            description: Day of the month (1-31)
          - name: DAY_IN_YEAR_NBR
            description: Date Time the record was commited into the table
          - name: WEEK_OF_YEAR
            description: The unique number of the load, this sequence is independent of the source
          - name: FISCAL_YEAR
            description: Fiscal year number representing the organization's financial reporting period
          - name: FISCAL_QUARTER
            description: 'DV_NAME: PILOT - Release: RV 1(1) - Comment: Raw Vault Release 1 initial load - Release date: 2022/12/01 20:24:00'
          - name: FISCAL_MONTH
            description: Fiscal month number within the fiscal year
          - name: IS_HOLIDAY
            description: Boolean flag indicating if the date is a holiday
          - name: HOLIDAY_NAME
            description: Name of the holiday on this date
          - name: IS_SPECIAL_EVENT
            description: Boolean flag indicating if the date is part of a special event
          - name: SPECIAL_EVENT_NAME
            description: Name of the special event on this date
          - name: SEASON_NAME
            description: Name of the season for this date

      - name: DIM_EMPLOYEE
        description: Dimension table storing employee master data
        meta:
          data_product_owner: Hazal
        columns:
          - name: EMPLOYEE_HK
            description: Unique surrogate key for employee
          - name: EMPLOYEE_ID
            description: Unique identifier for the employee
          - name: FIRST_NAME
            description: Employee's first name
          - name: LAST_NAME
            description: Employee's last name
          - name: ROLE_DESCRIPTION
            description: Detailed description of the employee's job role
          - name: BIRTH_DATE
            description: Employee's date of birth

      - name: DIM_FORECAST_TYPE
        description: Dimension table for different sales forecast types
        meta:
          data_product_owner: Hazal
        columns:
          - name: FORECAST_TYPE_HKEY
            description: Unique surrogate key for forecast type
          - name: FORECAST_TYPE_NAME
            description: Name of the forecast type
          - name: DESCRIPTION
            description: Detailed explanation of the forecast type

      - name: DIM_GEOGRAPHY
        description: Dimension table storing geographic location details
        meta:
          data_product_owner: Hazal
        columns:
          - name: GEOGRAPHY_HKEY
            description: Unique surrogate key for geographic location
          - name: COUNTRY_NAME
            description: Full name of the country
          - name: STATE_CD
            description: State or province abbreviation
          - name: CITY_NAME
            description: Name of the city
          - name: REGION_NAME
            description: Geographic region name

      - name: DIM_PRODUCT
        description: Dimension table storing detailed product master data
        meta:
          data_product_owner: Hazal
        columns:
          - name: PRODUCT_HKEY
            description: Unique surrogate key for the product
          - name: UPC_CD
            description: Universal Product Code for identification
          - name: PRODUCT_NAME
            description: Official name of the product
          - name: CATEGORY_NAME
            description: Product's broad category classification
          - name: LIST_PRICE_AMT
            description: Standard published price of the product
          - name: PRODUCT_COST_AMT
            description: Manufacturing or acquisition cost of the product
          - name: PRODUCT_GROUP
            description: Broader product line or grouping
          - name: PRODUCT_DESC
            description: Comprehensive description of the product
          - name: PRODUCT_SIZE
            description: Physical dimensions or packaging size of the product

      - name: FACT_CLTV
        description: Customer Lifetime Value Analysis Fact Table tracking revenue, cost, and customer value metrics
        meta:
          data_product_owner: Hazal
        columns:
          - name: CLTV_DATE
            description: The actual calendar date, serving as the primary reference for all date-related analysis.
          - name: CUSTOMER_HKEY
            description: Unique surrogate key identifying the specific customer
          - name: CHANNEL_HKEY
            description: Unique surrogate key identifying the sales channel
          - name: GEOGRAPHY_HKEY
            description: Unique surrogate key identifying the geographic location
          - name: TOTAL_REVENUE_AMT
            description: Aggregate revenue generated by the customer throughout their relationship
          - name: TOTAL_COST_AMT
            description: Total cost associated with serving the customer
          - name: LIFETIME_VALUE_AMT
            description: Calculated net value of the customer over their entire engagement

      - name: FACT_SALES
        description: Fact table capturing detailed sales transaction information
        meta:
          data_product_owner: Hazal
        columns:
          - name: SALE_DATE
            description: The actual calendar date, serving as the primary reference for all date-related analysis.
          - name: SHIPPED_DATE
            description: The actual calendar date, serving as the primary reference for all date-related analysis.
          - name: CAMPAIGN_HKEY
            description: Unique surrogate key for the marketing campaign
          - name: CUSTOMER_HKEY
            description: Unique surrogate key for the customer
          - name: GEOGRAPHY_HKEY
            description: Unique surrogate key for geographic location
          - name: SOLD_QTY
            description: Number of units sold in the transaction
          - name: TOTAL_SALES_AMT
            description: Total monetary value of the sales transaction
          - name: PRODUCT_HKEY
            description: Unique surrogate key for the product
          - name: EMPLOYEE_HK
            description: Unique surrogate key for the employee

      - name: FACT_SALES_FORECAST
        description: Sales Forecast Fact Table capturing predicted sales performance
        meta:
          data_product_owner: Hazal
        columns:
          - name: GEOGRAPHY_HKEY
            description: Unique surrogate key for geographic location
          - name: FORECAST_TYPE_HKEY
            description: Unique surrogate key identifying the forecast type
          - name: FORECAST_SALES_QTY
            description: Predicted number of units to be sold
          - name: FORECAST_SALES_AMT
            description: Projected total sales revenue
          - name: CONFIDENCE_LEVEL
            description: Probability or certainty level of the forecast
          - name: FORECAST_START_DATE
            description: The actual calendar date, serving as the primary reference for all date-related analysis.
          - name: FORECAST_END_DATE
            description: The actual calendar date, serving as the primary reference for all date-related analysis.
          - name: PRODUCT_HKEY
            description: Unique surrogate key for the product

      - name: hub_customer
        description: A customer is an individual or entity that engages with a business or organization to acquire products, services, or support.
        meta:
          data_product_owner: Hazal
        columns:
          - name: customer_hkey
            description: Unique hash key generated for the customer to serve as the primary key in the hub table.
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Identifies the source system from which the customer record was originally captured.
          - name: c_name_bk
            description: Unique business key representing the customer's name or identifier from the source system.
          - name: new_column
            description: Additional numeric attribute for the customer record.

      - name: hub_nation
        description: A hub table representing nation information in a data vault model, capturing essential nation-related data from various source systems.
        meta:
          data_product_owner: Hazal
        columns:
          - name: nation_hkey
            description: A unique identifier for each nation, generated using a hash function to ensure data integrity and efficient lookup.
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: The origin or system from which the nation record was sourced or extracted.
          - name: n_name_bk
            description: The original or canonical name of the nation as used in the source system.

      - name: hub_order
        description: Hub table for storing unique order identifiers across different systems
        meta:
          data_product_owner: Hazal
        columns:
          - name: order_hkey
            description: A unique identifier for each order, generated as a hash key to ensure data integrity and efficient lookup in the hub table
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Identifies the source system or origin of the order record, ensuring traceability and data provenance
          - name: o_orderkey_bk
            description: The unique business key representing the original order identifier from the source system
          - name: md5_hub_
            description: MD5 hash generated for the hub table to support data reconciliation and uniqueness validation
          - name: load_dts
            description: Precise timestamp indicating when the order record was loaded into the data warehouse

      - name: hub_product
        description: A hub table representing the core product information in a data vault model, capturing essential product attributes and serving as a central reference point for product-related data across the enterprise.
        meta:
          data_product_owner: Hazal
        columns:
          - name: product_hkey
            description: A unique hash key that serves as the primary identifier for each product record in the hub table, ensuring data integrity and facilitating efficient data retrieval and linkage.
          - name: upc_code
            description: Universal Product Code (UPC) is a standardized barcode system used to identify and track products in retail environments, providing a unique identifier for each product variant.
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Indicates the origin or source system from which the product record was initially captured, ensuring traceability and data lineage.

      - name: hub_region
        description: Hub table for storing unique region identifiers and core region information
        meta:
          data_product_owner: Hazal
        columns:
          - name: region_hkey
            description: Unique hash key representing a region's identifier
          - name: region_name
            description: Name of the geographic region
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Source system that provided this region record

      - name: hub_supplier
        description: Hub table designed to store the unique list of business keys of Suppliers.
        meta:
          data_product_owner: Hazal
        columns:
          - name: supplier_hkey
            description: Unique hash key that serves as the primary key for the Supplier Hub table, representing a distinct supplier business key.
          - name: supplier_nbr
            description: Unique identifier assigned to each supplier in the source system.
          - name: supplier_name
            description: Official or registered name of the supplier organization.
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Identifies the origin or source system from which the supplier record was initially loaded.

      - name: lks_tpch_supplier_nation
        description: Link table connecting Supplier and Nation entities in the Raw Vault, capturing their relationship
        meta:
          data_product_owner: Hazal
        columns:
          - name: lnk_supplier_nation_hkey
            description: Unique hash key representing the link between a Supplier and its associated Nation
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: delete_flag
            description: Indicates the data has been deleted from the source.  Used to soft delete the data in the data warehouse.
          - name: s_suppkey
            description: Unique identifier for the Supplier in the source system
          - name: s_nationkey
            description: Unique identifier for the Nation associated with the Supplier

      - name: lnd_lineitem
        description: A link table representing the relationship between orders and line items, capturing the essential details of each product within a customer's purchase.
        meta:
          data_product_owner: Hazal
        columns:
          - name: lnk_line_item_hash_key
            description: A unique hash key generated to create a distinct identifier for each line item link record, ensuring data integrity and enabling efficient data tracking.
          - name: order_hkey
            description: A foreign key hash reference to the specific order associated with this line item, establishing the connection between the order and its individual line items.
          - name: product_hkey
            description: A foreign key hash reference to the specific product included in this line item, linking the line item to its corresponding product details.
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Identifies the source system or data feed from which this line item record was originally extracted.

      - name: lnk_customer_nation
        description: Link table connecting customers with their associated nations, establishing a many-to-many relationship
        meta:
          data_product_owner: Hazal
        columns:
          - name: lnk_customer_nation_hkey
            description: Unique hash key for identifying the specific link between a customer and a nation
          - name: nation_hkey
            description: Foreign key referencing the hash key of the nation associated with this customer link
          - name: customer_hkey
            description: Foreign key referencing the hash key of the customer in this nation link
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Source system or process that generated this record

      - name: lnk_nation_region
        description: Link table connecting Nation and Region entities, representing the relationship between nations and regions
        meta:
          data_product_owner: Hazal
        columns:
          - name: lnk_nation_region_hkey
            description: Unique hash key identifying the specific nation-region link record
          - name: nation_hkey
            description: Foreign key referencing the hash key of the associated Nation
          - name: region_hkey
            description: Foreign key referencing the hash key of the associated Region
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Source system or process that created this record

      - name: lnk_orders_customer
        description: Link table connecting orders and customers, representing the many-to-many relationship between orders and customers
        meta:
          data_product_owner: Hazal
        columns:
          - name: lnk_orders_customer_hash_key
            description: Unique hash key for identifying the link between an order and a customer
          - name: order_hkey
            description: Foreign key referencing the hash key of the associated order
          - name: customer_hkey
            description: Foreign key referencing the hash key of the associated customer
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Source system or record origin identifier

      - name: lnk_product_supplier
        description: Link table representing the relationship between products and suppliers in the data vault model
        meta:
          data_product_owner: Hazal
        columns:
          - name: lnk_part_supplier_hkey
            description: Unique hash key to identify the link between a specific product and supplier
          - name: product_hkey
            description: Foreign key hash referencing the product in the product-supplier relationship
          - name: supplier_hkey
            description: Foreign key hash referencing the supplier in the product-supplier relationship
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: Source system or origin of the record

      - name: lnk_supplier_nation
        description: Linking table that connects suppliers with their corresponding nations, capturing the relationship between these two entities
        meta:
          data_product_owner: Hazal
        columns:
          - name: lnk_supplier_nation_hkey
            description: Unique hash key to identify and link the specific supplier-nation relationship record
          - name: load_date
            description: Date Time the record was commited into the table
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: record_source
            description: System or source that provided the supplier-nation relationship record
          - name: nation_hkey
            description: Hash key referencing the specific nation in this supplier-nation relationship
          - name: supplier_hkey
            description: Hash key referencing the specific supplier in this supplier-nation relationship

      - name: pit_end_of_day_customer
        description: Point-in-Time (PIT) table capturing historical snapshots of customer information at specific moments, enabling temporal analysis and historical tracking.
        meta:
          data_product_owner: Hazal
        columns:
          - name: pit_end_of_day_customer_hkey
            description: Unique surrogate key for identifying each Point-in-Time customer record
            tests:
              - unique
              - not null
          - name: customer_hkey
            description: Foreign key referencing the customer hash key for linking to the customer hub
            tests:
              - unique
              - not null
          - name: snapshot_timestamp
            description: Timestamp representing the specific moment of the customer snapshot
            tests:
              - unique
              - not null
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
            tests:
              - unique
              - not null
          - name: sat_pos_customer_sat_pos_customer_phi_hkey
            description: Hash key for the PHI (Protected Health Information) satellite of the customer
            tests:
              - unique
              - not null
          - name: sat_pos_customer_sat_pos_customer_phi_load_date
            description: Load date for the PHI satellite of the customer
            tests:
              - unique
              - not null
          - name: sat_pos_customer_sat_pos_customer_public_hkey
            description: Hash key for the public satellite of the customer
            tests:
              - unique
              - not null
          - name: sat_pos_customer_sat_pos_customer_public_load_date
            description: Load date for the public satellite of the customer
            tests:
              - unique
              - not null

      - name: sat_customer_pos_custom_phi
        description: Satellite table for capturing custom personal health information for customers with historical tracking
        meta:
          data_product_owner: Hazal
        columns:
          - name: customer_hkey
            description: Unique hash key identifying the customer
          - name: load_date
            description: Date Time the record was commited into the table
          - name: c_name
            description: Full name of the customer
          - name: c_custkey
            description: Unique customer identifier from source system
          - name: c_nationkey
            description: Nation key associated with the customer
          - name: c_address
            description: Customer's primary address
          - name: c_phone
            description: Customer's contact phone number
          - name: c_acctbal
            description: Customer's current account balance
          - name: c_acctbal_org
            description: Original account balance value from source
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: hash_diff
            description: Hash difference helps you identify differences in descriptive attributes quickly and add new satellite entries only when a change has been made to the satellite.
          - name: delete_flag
            description: Indicates the data has been deleted from the source.  Used to soft delete the data in the data warehouse.

      - name: sat_customer_pos_customer_public
        description: Satellite table for customer point of sale (POS) data in the public schema, storing customer details and tracking changes over time.
        meta:
          data_product_owner: Hazal
        columns:
          - name: customer_hkey
            description: Unique hash key that identifies a specific customer record in the satellite table.
          - name: load_date
            description: Date Time the record was commited into the table
          - name: c_custkey
            description: Unique identifier for the customer in the source system.
          - name: c_nationkey
            description: Foreign key representing the nation/country associated with the customer.
          - name: c_mktsegment
            description: Market segment classification for the customer (e.g., retail, wholesale, etc.).
          - name: c_comment
            description: Additional notes or descriptive text about the customer.
          - name: load_cycle_id
            description: The unique number of the load, this sequence is independent of the source
          - name: hash_diff
            description: Hash difference helps you identify differences in descriptive attributes quickly and add new satellite entries only when a change has been made to the satellite.
          - name: delete_flag
            description: Indicates the data has been deleted from the source.  Used to soft delete the data in the data warehouse.

      - name: sat_line_item_ecom_order_line
        description: A satellite table capturing detailed line item information for ECOM (e-commerce) orders, providing comprehensive attributes and tracking for individual order line entries.
        meta:
          data_product_owner: Hazal
        columns:
          - name: lnk_line_item_hash_key
            description: A unique hash key that links and identifies the specific line item within the order, used for efficient data retrieval and relationship mapping.
          - name: load_date
            description: Date Time the record was commited into the table
          - name: l_orderkey
            description: Unique identifier for the order to which this line item belongs, enabling order-level tracking and reference.
          - name: l_partkey
            description: Unique identifier for the specific product or part associated with this line item.
          - name: l_suppkey
            description: Identifier for the supplier of the product in this line item, facilitating supplier tracking.
          - name: l_linenbr
            description: Sequential number representing the position or sequence of this line item within the order.
          - name: l_quantity
            description: The total number of units or quantity of the specific product in this line item.
          - name: l_extendedprice
            description: Total price for this line item, calculated by multiplying the unit price by the quantity.
          - name: l_discount
            description: Percentage or amount of discount applied to this specific line item.
          - name: l_tax
            description: Total tax amount calculated for this line item based on applicable tax rates.
          - name: l_linestatus
            description: Current processing or fulfillment status of this specific line item (e.g., pending, shipped, cancelled).
          - name: l_shipdate
            description: Scheduled or planned date for shipping this line item to the customer.
          - name: l_receiptdate
            description: Date when this line item was actually received by the customer or shipping destination.
          - name: l_shipinstruct
            description: Special instructions or notes related to the shipping of this specific line item.
          - name: l_shipmode
            description: Selected method of shipping for this line item (e.g., standard, express, overnight).
          - name: l_comment
            description: Additional comments or notes providing extra context about this line item.
          - name: load_cycle_id
